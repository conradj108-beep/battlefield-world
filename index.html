<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Project Battlefield</title>


<style>

/* =========================================================
   BASE
========================================================= */

* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #05070a;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    user-select: none;
}


#game {

    position: fixed;

    inset: 0;

}


/* =========================================================
   CINEMATIC INTRO
========================================================= */

#intro {

    position: fixed;

    inset: 0;

    z-index: 50;

    display: flex;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    color: white;

    background:

        radial-gradient(
            circle at center,
            rgba(35,50,60,.45),
            rgba(0,0,0,.98)
        );

    transition:

        opacity 2s ease,
        visibility 2s ease;

}


#intro.hidden {

    opacity: 0;

    visibility: hidden;

}


.classified {

    font-size: 11px;

    letter-spacing: 7px;

    color: #9daab1;

    margin-bottom: 25px;

    text-align: center;

}


.title {

    font-size:
        clamp(38px, 8vw, 100px);

    font-weight: 300;

    letter-spacing: 12px;

    text-align: center;

    margin: 0;

    text-shadow:

        0 0 20px
        rgba(255,255,255,.12),

        0 5px 35px
        rgba(0,0,0,.9);

}


.subtitle {

    margin-top: 20px;

    color: #849199;

    letter-spacing: 5px;

    font-size: 12px;

    text-align: center;

}


.loading {

    position: absolute;

    bottom: 70px;

    width:
        min(380px,70vw);

    height: 2px;

    background:
        rgba(255,255,255,.15);

}


.loadingBar {

    width: 0%;

    height: 100%;

    background: #d8e2e7;

    box-shadow:
        0 0 18px
        rgba(220,240,255,.55);

    transition:
        width .15s linear;

}


/* =========================================================
   CLICK TO ENTER
========================================================= */

#enter {

    position: fixed;

    inset: 0;

    z-index: 45;

    display: none;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    color: white;

    background:
        rgba(0,0,0,.28);

}


#enter.visible {

    display: flex;

}


.enterTitle {

    font-size: 13px;

    letter-spacing: 5px;

    color: rgba(255,255,255,.65);

    margin-bottom: 18px;

}


.enterButton {

    padding: 15px 30px;

    border:

        1px solid
        rgba(255,255,255,.35);

    background:

        rgba(10,15,18,.55);

    color: white;

    font-size: 12px;

    letter-spacing: 4px;

    cursor: pointer;

    backdrop-filter: blur(8px);

    transition:

        background .25s ease,
        border .25s ease;

}


.enterButton:hover {

    background:
        rgba(255,255,255,.12);

    border-color:
        rgba(255,255,255,.75);

}


/* =========================================================
   HUD
========================================================= */

#hud {

    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: 10;

    color:
        rgba(255,255,255,.75);

    opacity: 0;

    transition:
        opacity 1.5s ease;

}


#hud.visible {

    opacity: 1;

}


/* Coordinates */

.coordinates {

    position: absolute;

    top: 24px;

    left: 28px;

    font-size: 10px;

    letter-spacing: 3px;

    color:
        rgba(255,255,255,.5);

}


/* Bottom status */

.status {

    position: absolute;

    bottom: 25px;

    left: 28px;

    font-size: 9px;

    letter-spacing: 3px;

    color:
        rgba(255,255,255,.4);

}


/* Location */

.location {

    position: absolute;

    bottom: 25px;

    right: 28px;

    text-align: right;

    font-size: 9px;

    line-height: 1.8;

    letter-spacing: 3px;

    color:
        rgba(255,255,255,.4);

}


/* Crosshair */

.crosshair {

    position: absolute;

    left: 50%;

    top: 50%;

    width: 20px;

    height: 20px;

    transform:
        translate(-50%,-50%);

    opacity: .32;

}


.crosshair::before,
.crosshair::after {

    content: "";

    position: absolute;

    background:
        rgba(255,255,255,.85);

}


.crosshair::before {

    width: 1px;

    height: 20px;

    left: 9px;

    top: 0;

}


.crosshair::after {

    width: 20px;

    height: 1px;

    left: 0;

    top: 9px;

}


/* =========================================================
   COMPASS
========================================================= */

.compass {

    position: absolute;

    top: 24px;

    left: 50%;

    transform:
        translateX(-50%);

    width: 260px;

    text-align: center;

    font-size: 10px;

    letter-spacing: 4px;

    color:
        rgba(255,255,255,.45);

}


#direction {

    color: white;

    font-size: 11px;

}


/* =========================================================
   SPEED
========================================================= */

.speed {

    position: absolute;

    bottom: 60px;

    left: 50%;

    transform:
        translateX(-50%);

    font-size: 9px;

    letter-spacing: 3px;

    color:
        rgba(255,255,255,.35);

}


/* =========================================================
   VIGNETTE
========================================================= */

.vignette {

    position: fixed;

    inset: 0;

    z-index: 5;

    pointer-events: none;

    background:

        radial-gradient(
            ellipse at center,
            transparent 48%,
            rgba(0,0,0,.18) 75%,
            rgba(0,0,0,.65) 100%
        );

}


/* =========================================================
   MOVEMENT HINT
========================================================= */

#controlsHint {

    position: fixed;

    left: 50%;

    bottom: 90px;

    transform:
        translateX(-50%);

    z-index: 20;

    color:
        rgba(255,255,255,.65);

    font-size: 10px;

    letter-spacing: 2px;

    opacity: 0;

    transition:
        opacity 1s ease;

    pointer-events: none;

}


#controlsHint.visible {

    opacity: 1;

}


</style>

</head>


<body>


<div id="game"></div>


<!-- =======================================================
     INTRO
======================================================= -->

<div id="intro">

    <div class="classified">
        FIELD OPERATIONS DIVISION
    </div>

    <h1 class="title">
        PROJECT BATTLEFIELD
    </h1>

    <div class="subtitle">
        OPEN WORLD ENVIRONMENT // PROTOTYPE
    </div>

    <div class="loading">

        <div
            class="loadingBar"
            id="loadingBar">
        </div>

    </div>

</div>


<!-- =======================================================
     ENTER
======================================================= -->

<div id="enter">

    <div class="enterTitle">
        FIELD SIMULATION READY
    </div>

    <button
        class="enterButton"
        id="enterButton">

        CLICK TO ENTER

    </button>

</div>


<!-- =======================================================
     HUD
======================================================= -->

<div id="hud">

    <div class="coordinates">
        POSITION
        <span id="position">
            000 / 000
        </span>
    </div>


    <div class="compass">

        <span id="direction">
            N
        </span>

    </div>


    <div class="crosshair"></div>


    <div class="status">
        ENVIRONMENT ONLINE
    </div>


    <div class="speed">

        SPEED
        <span id="speed">
            0
        </span>

    </div>


    <div class="location">

        SECTOR 01<br>

        UNKNOWN TERRITORY

    </div>

</div>


<div
    class="vignette">
</div>


<div
    id="controlsHint">

    WASD MOVE &nbsp; • &nbsp;
    SHIFT SPRINT &nbsp; • &nbsp;
    SPACE JUMP &nbsp; • &nbsp;
    ESC RELEASE MOUSE

</div>


<!-- =======================================================
     THREE.JS
======================================================= -->

<script type="importmap">

{

    "imports": {

        "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"

    }

}

</script>


<!-- =======================================================
     GAME
======================================================= -->

<script type="module">


import * as THREE
    from "three";


import {
    PlayerController
}
from "./js/player.js";


/* =========================================================
   SCENE
========================================================= */

const scene =
    new THREE.Scene();


scene.background =
    new THREE.Color(
        0x9fb4c2
    );


scene.fog =
    new THREE.FogExp2(
        0x9fb4c2,
        0.0025
    );


/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(

        70,

        window.innerWidth /
        window.innerHeight,

        .1,

        5000

    );


camera.position.set(
    0,
    25,
    100
);


/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({

        antialias: true,

        powerPreference:
            "high-performance"

    });


renderer.setSize(

    window.innerWidth,
    window.innerHeight

);


renderer.setPixelRatio(

    Math.min(
        window.devicePixelRatio,
        2
    )

);


renderer.shadowMap.enabled =
    true;


renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;


renderer.outputColorSpace =
    THREE.SRGBColorSpace;


renderer.toneMapping =
    THREE.ACESFilmicToneMapping;


renderer.toneMappingExposure =
    1.1;


document
    .getElementById("game")
    .appendChild(
        renderer.domElement
    );


/* =========================================================
   LIGHTING
========================================================= */

const ambient =
    new THREE.HemisphereLight(

        0xbfd3df,
        0x283028,
        2

    );


scene.add(
    ambient
);


const sun =
    new THREE.DirectionalLight(

        0xffe5c0,
        4

    );


sun.position.set(

    -300,
    500,
    -250

);


sun.castShadow =
    true;


sun.shadow.mapSize.width =
    2048;


sun.shadow.mapSize.height =
    2048;


sun.shadow.camera.left =
    -500;


sun.shadow.camera.right =
    500;


sun.shadow.camera.top =
    500;


sun.shadow.camera.bottom =
    -500;


scene.add(
    sun
);


/* =========================================================
   TERRAIN
========================================================= */

const terrainSize =
    1800;


const geometry =
    new THREE.PlaneGeometry(

        terrainSize,
        terrainSize,

        180,
        180

    );


const positions =
    geometry.attributes.position;


function terrainHeight(
    x,
    z
) {

    let height = 0;


    height +=

        Math.sin(
            x * .012
        ) *

        Math.cos(
            z * .010
        ) *

        18;


    height +=

        Math.sin(
            x * .027 + 2
        ) *

        Math.cos(
            z * .018
        ) *

        8;


    height +=

        Math.sin(
            x * .055
        ) *

        Math.cos(
            z * .041
        ) *

        3;


    const mountain =

        Math.max(

            0,

            1 -

            Math.sqrt(

                x*x +

                (z+350) *
                (z+350)

            ) / 650

        );


    height +=
        mountain * 60;


    return height;

}


/* Build terrain */

for (

    let i = 0;

    i < positions.count;

    i++

) {

    const x =
        positions.getX(i);

    const z =
        positions.getY(i);


    positions.setZ(

        i,

        terrainHeight(
            x,
            z
        )

    );

}


geometry.computeVertexNormals();


const terrainMaterial =
    new THREE.MeshStandardMaterial({

        color:
            0x4b5b43,

        roughness:
            .95,

        metalness:
            0

    });


const terrain =
    new THREE.Mesh(

        geometry,
        terrainMaterial

    );


terrain.rotation.x =
    -Math.PI / 2;


terrain.receiveShadow =
    true;


scene.add(
    terrain
);


/* =========================================================
   MOUNTAINS
========================================================= */

function createMountain(
    x,
    z,
    scale
) {


    const mountainGeometry =

        new THREE.ConeGeometry(

            180 * scale,

            300 * scale,

            8

        );


    const mountainMaterial =

        new THREE.MeshStandardMaterial({

            color:
                0x39443f,

            roughness:
                1

        });


    const mountain =

        new THREE.Mesh(

            mountainGeometry,
            mountainMaterial

        );


    mountain.position.set(

        x,

        100 * scale,

        z

    );


    mountain.castShadow =
        true;


    mountain.receiveShadow =
        true;


    scene.add(
        mountain
    );

}


createMountain(
    -650,
    -650,
    2
);


createMountain(
    -300,
    -750,
    1.5
);


createMountain(
    100,
    -800,
    2.3
);


createMountain(
    550,
    -700,
    1.8
);


createMountain(
    850,
    -500,
    1.3
);


/* =========================================================
   TREES
========================================================= */

function createTree(
    x,
    z
) {


    const trunkGeometry =
        new THREE.CylinderGeometry(

            1.2,
            1.8,
            12,
            7

        );


    const trunkMaterial =
        new THREE.MeshStandardMaterial({

            color:
                0x3d3024,

            roughness:
                1

        });


    const trunk =
        new THREE.Mesh(

            trunkGeometry,
            trunkMaterial

        );


    const ground =
        terrainHeight(
            x,
            z
        );


    trunk.position.set(

        x,
        ground + 6,
        z

    );


    const crownGeometry =
        new THREE.ConeGeometry(

            8,
            28,
            8

        );


    const crownMaterial =
        new THREE.MeshStandardMaterial({

            color:
                0x243c2b,

            roughness:
                1

        });


    const crown =
        new THREE.Mesh(

            crownGeometry,
            crownMaterial

        );


    crown.position.set(

        x,
        ground + 23,
        z

    );


    crown.castShadow =
        true;


    trunk.castShadow =
        true;


    scene.add(
        trunk
    );


    scene.add(
        crown
    );

}


/* Forest */

for (
    let i = 0;
    i < 420;
    i++
) {


    const x =
        (Math.random()-.5) *
        1500;


    const z =
        (Math.random()-.5) *
        1300;


    if (

        Math.abs(x) < 180 &&

        Math.abs(z) < 180

    ) {

        continue;

    }


    createTree(
        x,
        z
    );

}


/* =========================================================
   WATER
========================================================= */

const waterGeometry =
    new THREE.PlaneGeometry(
        1400,
        300
    );


const waterMaterial =
    new THREE.MeshStandardMaterial({

        color:
            0x294d5c,

        roughness:
            .18,

        metalness:
            .35,

        transparent:
            true,

        opacity:
            .82

    });


const water =
    new THREE.Mesh(

        waterGeometry,
        waterMaterial

    );


water.rotation.x =
    -Math.PI / 2;


water.position.set(

    350,
    1,
    -250

);


scene.add(
    water
);


/* =========================================================
   ROAD
========================================================= */

const roadGeometry =
    new THREE.PlaneGeometry(

        35,
        1000

    );


const roadMaterial =
    new THREE.MeshStandardMaterial({

        color:
            0x292927,

        roughness:
            1

    });


const road =
    new THREE.Mesh(

        roadGeometry,
        roadMaterial

    );


road.rotation.x =
    -Math.PI / 2;


road.position.set(

    0,
    2,
    0

);


scene.add(
    road
);


/* =========================================================
   PLAYER
========================================================= */

const player =
    new PlayerController(

        camera,

        terrain

    );


/* =========================================================
   INTRO
========================================================= */

const intro =
    document.getElementById(
        "intro"
    );


const enter =
    document.getElementById(
        "enter"
    );


const enterButton =
    document.getElementById(
        "enterButton"
    );


const loadingBar =
    document.getElementById(
        "loadingBar"
    );


const hud =
    document.getElementById(
        "hud"
    );


const controlsHint =
    document.getElementById(
        "controlsHint"
    );


let progress = 0;


const loading =
    setInterval(
        () => {


            progress +=
                Math.random() * 9;


            if (
                progress >= 100
            ) {


                progress = 100;


                clearInterval(
                    loading
                );


                setTimeout(
                    () => {


                        intro.classList.add(
                            "hidden"
                        );


                        enter.classList.add(
                            "visible"
                        );

                    },
                    700
                );

            }


            loadingBar.style.width =
                progress + "%";


        },
        120
    );


/* =========================================================
   ENTER WORLD
========================================================= */

enterButton.addEventListener(
    "click",
    () => {


        document.body.requestPointerLock();


        enter.classList.remove(
            "visible"
        );


        hud.classList.add(
            "visible"
        );


        controlsHint.classList.add(
            "visible"
        );


        setTimeout(
            () => {

                controlsHint.classList.remove(
                    "visible"
                );

            },
            5000
        );

    }
);


/* =========================================================
   POINTER LOCK
========================================================= */

document.addEventListener(
    "pointerlockchange",
    () => {


        const locked =
            document.pointerLockElement ===
            document.body;


        if (
            !locked &&
            !intro.classList.contains(
                "hidden"
            )
        ) {

            return;

        }


        if (
            !locked &&
            !enter.classList.contains(
                "visible"
            )
        ) {

            enter.classList.add(
                "visible"
            );

        }

    }
);


/* =========================================================
   HUD UPDATE
========================================================= */

const positionText =
    document.getElementById(
        "position"
    );


const speedText =
    document.getElementById(
        "speed"
    );


const directionText =
    document.getElementById(
        "direction"
    );


function updateHUD() {


    positionText.textContent =

        Math.round(
            player.position.x
        ) +

        " / " +

        Math.round(
            player.position.z
        );


    const horizontalSpeed =

        Math.sqrt(

            player.velocity.x *
            player.velocity.x +

            player.velocity.z *
            player.velocity.z

        );


    speedText.textContent =
        Math.round(
            horizontalSpeed
        );


    let degrees =

        THREE.MathUtils.radToDeg(
            player.yaw
        );


    degrees =
        (degrees + 360) % 360;


    const directions = [

        "N",
        "NE",
        "E",
        "SE",
        "S",
        "SW",
        "W",
        "NW"

    ];


    const index =

        Math.round(
            degrees / 45
        ) % 8;


    directionText.textContent =
        directions[index];

}


/* =========================================================
   ANIMATION
========================================================= */

const clock =
    new THREE.Clock();


function animate() {


    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );


    player.update(
        delta
    );


    updateHUD();


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {


        camera.aspect =

            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,
            window.innerHeight

        );


        renderer.setPixelRatio(

            Math.min(
                window.devicePixelRatio,
                2
            )

        );

    }
);


</script>

</body>

</html>
